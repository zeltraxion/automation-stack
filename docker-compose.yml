name: n8n-local
services:
  n8n:
    image: n8nio/n8n:${N8N_VERSION}
    container_name: n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RESTRICT_FILE_ACCESS_TO=/vault
    volumes:
      - n8n_data:/home/node/.n8n
      - ${VAULT_PATH:?Set VAULT_PATH to an absolute vault path}/control_plane:/vault/control_plane:ro
      - ${VAULT_PATH:?Set VAULT_PATH to an absolute vault path}/dashboard:/vault/dashboard
      - ${VAULT_PATH:?Set VAULT_PATH to an absolute vault path}/files:/vault/files
      - ${VAULT_PATH:?Set VAULT_PATH to an absolute vault path}/memory/briefing:/vault/memory/briefing:ro
      - ${VAULT_PATH:?Set VAULT_PATH to an absolute vault path}/memory/learned:/vault/memory/learned

volumes:
  n8n_data:
    external: true